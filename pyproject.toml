ignore_imports = [
    "src.application.** -> src.application.shared.**",
    "src.infrastructure.composition.** -> src.application.**",
]
allow_indirect_imports = true
unmatched_ignore_imports_alerting = "warn"

[[tool.importlinter.contracts]]
name = "Application context map"
type = "independence"
unmatched_ignore_imports_alerting = "error"
modules = [
    "src.application.coffee_bom",
    "src.application.demand_analytics",
    "src.application.form_submissions",
    "src.application.form_workflow",
    "src.application.inventory_reconciliation",
    "src.application.machine_operations",
    "src.application.matrix_automation",
    "src.application.outbox",
    "src.application.photo_batches",
    "src.application.photo_integrity",
    "src.application.reference_data",
    "src.application.master_data",
    "src.application.shared",
    "src.application.sheets",
    "src.application.technician_accountability",
    "src.application.technician_settlement",
    "src.application.technician_warehouse",
    "src.application.visit_photo_review",
    "src.application.visit_photo_grouping",
    "src.application.snack_loading",
    "src.application.micromarket_loading",
    # ignore_imports for sales_monitoring → machine_operations and
    # outbox → sales_monitoring added with first real cross-BC imports (fragment 04).
    "src.application.sales_monitoring",
    "src.application.event_reminders",
    # machine_pnl edges (→ inventory_reconciliation; outbox → machine_pnl) — fragment 03.
    "src.application.machine_pnl",
    # ignore_imports outbox → service_visits — fragment 06 (first real cross-BC import).
    "src.application.service_visits",
    "src.application.product_identity",
    "src.application.form_inventory_policy",
]
ignore_imports = [
    # shared kernel (forbidden-контракт свой ignore не шарит с independence)
    "src.application.** -> src.application.shared.**",
    # as-is прямые рёбра (package barrel и/или submodule — только реально встречающиеся формы)
    "src.application.coffee_bom.** -> src.application.product_identity",
    "src.application.coffee_bom.** -> src.application.product_identity.**",
    "src.application.form_submissions.** -> src.application.machine_operations",
    "src.application.inventory_reconciliation.** -> src.application.coffee_bom.**",
    "src.application.inventory_reconciliation.** -> src.application.form_submissions",
    "src.application.inventory_reconciliation.** -> src.application.form_submissions.**",
    "src.application.inventory_reconciliation.** -> src.application.snack_loading",
    "src.application.inventory_reconciliation.** -> src.application.micromarket_loading",
