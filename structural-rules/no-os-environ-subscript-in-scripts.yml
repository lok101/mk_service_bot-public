id: no-os-environ-subscript-in-scripts
language: python
severity: error
message: os.environ[...] read in scripts/ needs an explicit structural ignore.
files:
  - scripts/**/*.py
ignores:
  - scripts/agent_job.py
  - scripts/agent_adr_number_lib/paths.py
  - scripts/tracker_issue_lib/cli.py
  - scripts/tracker_issue_lib/time_display.py
  - scripts/counterfactual_exit_warehouse.py
rule:
  any:
    - pattern: $X = os.environ[$KEY]
    - pattern: return os.environ[$KEY]
    - pattern: $F(os.environ[$KEY])
    - pattern: $F($A, os.environ[$KEY])
    - pattern: $F(os.environ[$KEY], $B)
    - pattern: os.environ[$KEY] or $Y
    - pattern: $Y or os.environ[$KEY]
